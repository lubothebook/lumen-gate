[package]
name = "zk-vm"
version = "0.1.0"
edition = "2021"
# Inherit the root [workspace.package] value for the cargo-deny license gate
license.workspace = true

[lints]
workspace = true

[dependencies]
zk-isa = { path = "../zk-isa" }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[features]
experimental = ["zk-isa/experimental"]
