[package]
name = "gate-tier-parity"
version = "0.1.0"
edition = "2021"
# Inherit the root [workspace.package] value for the cargo-deny license gate
license.workspace = true

[lints]
workspace = true

[dependencies]
zk-isa = { path = "../zk-isa" }
zk-vm = { path = "../zk-vm" }
zk-compiler = { path = "../zk-compiler" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
