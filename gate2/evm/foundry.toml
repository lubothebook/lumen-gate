[profile.default]
# Ek A 4.6: no floating compiler assumption - the solc pin is itself a frozen
# dependency, same spirit as the no-upgrade rule. deny_warnings turns every
# compiler warning into a build error, per the annex.
solc_version = "0.8.30"
deny = "warnings" # forge 1.8 wants `deny = "warnings"`; both spellings honored by this version
evm_version = "cancun"
src = "src"
out = "out"
libs = ["lib"]
fuzz = { runs = 500 }
invariant = { runs = 200, depth = 8 }
optimizer = true
optimizer_runs = 200
via_ir = true
