name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: writing rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: repository gate
        run: ./scripts/repo-gate.sh

  tests:
    name: rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.98.1'
          target: wasm32v1-none
          cache: true
      # The setup action passes `-D warnings` by default and that is kept on
      # purpose: every field the relayer decodes is now read by the code that
      # submits, and the one crate-wide warning class the SDK forces (the
      # deprecated event publisher) is allowed with a reason at the crate root
      # rather than left to erode. Dead code is a CI error, not a suggestion.
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: |
          # The setup action installs a bare toolchain; clippy is not
          # guaranteed to be part of it. Make the requirement explicit rather
          # than let a missing binary read as an exit-1 mystery. And since
          # log downloads need repository admin rights, failures are
          # republished as annotations, which every collaborator can see.
          rustup component add clippy --toolchain 1.98.1-x86_64-unknown-linux-gnu
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log || {
            tail -n 40 /tmp/clippy.log | python3 -c 'import sys
          for line in sys.stdin:
              print("::error::" + line.rstrip().replace("%", "%25"))'
            exit 1
          }
      - name: cargo fmt
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee /tmp/fmt.log || {
            {
              echo "cargo fmt reported diffs; first lines:"
              head -n 30 /tmp/fmt.log
            } | python3 -c 'import sys
          for line in sys.stdin:
              print("::error::" + line.rstrip().replace("%", "%25"))'
            exit 1
          }

  contracts:
    name: contracts build to wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.98.1'
          target: wasm32v1-none
          cache: true
      - name: install the pinned stellar CLI
        run: |
          # soroban-sdk 28 refuses a plain `cargo build` for wasm outright: its
          # build script only passes when the build system sets the
          # spec-shaking marker that `stellar contract build` exports, so a
          # raw cargo invocation can never be green here. Pinning the CLI to
          # the SDK's own release line keeps the marker and the optimizer
          # deterministic without depending on what a runner happens to have.
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/stellar.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version
      - name: build both contracts
        run: |
          stellar contract build
          ls -l target/wasm32v1-none/release/*.wasm

  surface:
    name: anchor surface and console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install the SDK the SEP-10 checks need
        run: npm install --no-audit --no-fund
      - name: syntax check every JavaScript entrypoint
        run: |
          for file in api/*.js anchor/*.js anchor/lib/*.js tools/*.js frontend/src/*.js scripts/*.js; do
            node --check "$file"
          done
      - name: console wiring
        run: node tools/check-console.js
      - name: serverless handlers answer in the documented shape
        run: node tools/test-api.js
      - name: build the console
        run: cd frontend && npm install --no-audit --no-fund && npm run build
      - name: start the facade with a throwaway SEP-10 key
        run: |
          # The key is generated inside the job and never funded: SEP-10 only
          # needs a signer for the challenge, and the challenge transaction is
          # never submitted to any network.
          KEY=$(node -e "const {Keypair}=require('@stellar/stellar-sdk');process.stdout.write(Keypair.random().secret())")
          # The key is appended to $GITHUB_ENV for the probe step, which signs
          # a stale challenge of its own, but it must also be inlined on the
          # server command: GITHUB_ENV only takes effect for later steps, and
          # a server started in this same step without the key answers every
          # SEP-10 route as not_configured and collapses the whole probe.
          echo "SEP10_SIGNING_SECRET=$KEY" >> "$GITHUB_ENV"
          PUBLIC_FACADE_URL=http://127.0.0.1:8081 SEP10_HOME_DOMAIN=127.0.0.1:8081 SEP10_SIGNING_SECRET="$KEY" node anchor/server.js > /tmp/facade.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/v1/health > /dev/null && break
            sleep 1
          done
          curl -sS http://127.0.0.1:8081/v1/health
      - name: SEP conformance probe
        env:
          FACADE_URL: http://127.0.0.1:8081
          SEP10_HOME_DOMAIN: 127.0.0.1:8081
          PUBLIC_FACADE_URL: http://127.0.0.1:8081
        run: node tools/sep-conformance.js
      - name: facade log
        if: always()
        run: cat /tmp/facade.log
