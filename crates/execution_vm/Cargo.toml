[package]
name = "execution_vm"
version = "0.1.0"
edition = "2021"
description = "A small register machine with a committed program, an execution trace, per-step transition constraints, boundary conditions and a memory-consistency chain -- the execution lane whose relation the Groth16 circuit next to it proves."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
