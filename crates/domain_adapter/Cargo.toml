[package]
name = "domain_adapter"
version = "0.1.0"
edition = "2021"
description = "Raw-evidence-in, finality-attestation-out boundary for source domains, plus the cross-domain message envelope and its replay guard."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
